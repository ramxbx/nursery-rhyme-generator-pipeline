paths:
  data_dir: data
  scripts_dir: data/scripts
  images_dir: data/images
  audio_dir: data/audio
  output_dir: data/output
  logs_dir: logs

script:
  creative_rewrite: true
  metre_rewrite: true          # rewrite lines to a shared syllable count so they sing to one melody
  elaborate_scene_description: true
  scene_planning:
    enabled: true              # false restores one scene per source line
    target_scene_duration_s: 4.0   # lower -> more, shorter scenes (more images)
    min_scenes: 1
    max_scenes: 16
    max_words_per_scene: 14    # beyond this the subtitle wraps over the picture

music:
  enabled: true
  backend: musicgen  # musicgen | procedural
  volume: 0.15   # music is now ducked under the voice and no longer halved by amix, so it needs far less
  duck: true     # push the music down while a word is sung, let it swell back between lines
  prompt: "cheerful children's nursery rhyme background music, xylophone and ukulele, playful, gentle, major key"

subtitles:
  enabled: true
  font_size: 120

models:
  llm:
    endpoint: http://127.0.0.1:1234/v1
    primary: lfm2-1.2b-bench
    fallback: gemma-3-1b-bench
    excluded:
      - qwen3-1.7b-bench
    context_length: 4096
    max_concurrent_requests: 1
    request_timeout_s: 60
    max_retries: 2

video:
  fps: 24
  codec: h264
  width: 1920
  height: 1080

gpu:
  single_stage_at_a_time: true
  image_stage_device: cuda

visual:
  # Both OFF. Character identity was attempted twice and neither tier delivered:
  #
  # Tier 1 (character_bank) - a canonical descriptor injected into every prompt.
  #   Verified present in all four prompts of a test run and absent from all four
  #   images. Text conditioning holds species, colour and build; it does not
  #   enforce accessories or markings on SD1.5 at all.
  # Tier 2 (ip_adapter) - conditioning on a reference portrait. Cost three runs
  #   to integration bugs (hires pass not passing image embeds, reference key
  #   derived from the wrong string, image encoder unhooked from CPU offload) and
  #   never produced a comparable image, so it remains untested rather than
  #   disproven.
  #
  # The code and tests stay so either can be revisited (GPT-36/GPT-37); flipping
  # these back to true is all that is needed. Image generation otherwise keeps
  # the changes that DID work: varied framing per scene and the hires pass.
  character_bank: false
  ip_adapter: false
  ip_adapter_scale: 0.5
