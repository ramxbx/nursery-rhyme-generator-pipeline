backend: diffusers
# Modern Disney style, a community fine-tune of SD1.5 (GPT-31). Base SD1.5 is
# the raw research release and looks it - swapping to a fine-tuned checkpoint
# was by far the largest single quality jump in this project, from ~1-in-4
# scenes coherent to a genuinely appealing cartoon look, at the same speed,
# VRAM and step count. Trigger phrase "modern disney style" leads every prompt
# (see STYLE_ANCHOR in visual_agent.py). No fp16 variant published, so `variant`
# is unset here and weights are cast to fp16 at load time instead.
base_model: nitrosocke/mo-di-diffusion
# LCM-LoRA was dropped (tested at 4/8/14+ steps and in several LoRA-stacking
# combinations without a clear quality win) and a StorybookRedmond style LoRA
# was tried and reverted (seed-sensitive, frequently wrong subject). Standard
# scheduler at a normal step count, with DPM++ 2M Karras set in sd_pipeline.py.
steps: 30
guidance_scale: 7.0
# Deliberately does NOT contain "3d render" / "photorealistic" / "painterly".
# Those were left over from the flat-crayon era and actively fight this
# checkpoint, whose native look IS 3D Disney-style rendering - including them
# pushed output into a washed-out middle ground (distant, photographic-looking
# scenes) instead of the appealing cartoon style the model does well (GPT-31).
# The colour-cast terms are load-bearing: a strong colour word in the subject
# descriptor (e.g. "rosy pink pig") tints the WHOLE frame, not just the
# subject - measured at +40.9 magenta on a barn interior. These pull it back.
negative_prompt: "blurry, distorted, deformed, extra limbs, extra fingers, mutated, text, watermark, signature, ugly, low quality, scary, dark, grayscale, pink tint, colour cast, monochrome, oversaturated"
# SD1.5 is trained at 512x512; generating at a strongly non-square aspect is
# off-distribution and was a direct cause of the duplicated/tiled-subject and
# melted-composition failures chased in GPT-28 (GPT-32). Generate square, then
# crop to the 16:9 video frame during FFmpeg assembly.
width: 512
height: 512
output_width: 1920
output_height: 1080
seed_per_character: true
enable_model_cpu_offload: true
enable_vae_slicing: true
enable_vae_tiling: true
attention_backend: sdpa

# Hires fix (GPT-40): SD1.5 is trained at 512x512 and generating natively above
# that produces the duplicated/tiled output seen in GPT-28, so resolution can't
# simply be raised. Instead the selected 512 image is upscaled and re-rendered
# at low denoise, which preserves the composition while adding detail the first
# pass had no pixels for - a subject 60px tall in a wide shot cannot have eyes
# at 512, but can at 768.
hires_fix: true
hires_scale: 1.5      # 512 -> 768
hires_denoise: 0.4    # measured: hires adds only ~3 to the magenta index, the cast is from the base prompt
hires_steps: 24
