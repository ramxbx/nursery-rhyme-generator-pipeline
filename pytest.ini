[pytest]
# The integration test runs the REAL pipeline: it loads SD1.5 onto the GPU and
# writes to the shared data/images and data/audio manifests. Running it
# automatically meant `pytest` competed with any actual pipeline run for a 4GB
# card and for the same files - both failed. It was gated only on the LLM
# endpoint being reachable, so it stayed invisible whenever that was down and
# fired the moment it came up.
#
# It is now opt-in. Run it deliberately, when nothing else is using the GPU:
#     pytest -m slow
addopts = -m "not slow"
markers =
    slow: runs the real pipeline end to end (GPU + shared data/ paths)
